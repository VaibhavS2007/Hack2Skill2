# ==============================================================
# Google Cloud Build & Google Cloud Run CI/CD Pipeline
# SpendIntruders - Hack2skill Hackathon Automated Deployment
# ==============================================================

steps:
  # 1. Install dependencies
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['ci']
    id: 'install-deps'

  # 2. Run Test Suite (Vitest Unit & Engine Tests)
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['run', 'test']
    id: 'run-unit-tests'

  # 3. Build Production Container for Google Cloud Run
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/spendintruders:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/spendintruders:latest'
      - '.'
    id: 'docker-build'

  # 4. Push Container Image to Google Artifact Registry / Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/spendintruders:$COMMIT_SHA']
    id: 'docker-push'

  # 5. Deploy directly to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'spendintruders'
      - '--image'
      - 'gcr.io/$PROJECT_ID/spendintruders:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
    id: 'deploy-cloud-run'

images:
  - 'gcr.io/$PROJECT_ID/spendintruders:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/spendintruders:latest'

options:
  logging: CLOUD_LOGGING_ONLY
